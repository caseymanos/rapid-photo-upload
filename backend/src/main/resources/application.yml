spring:
  application:
    name: rapid-photo-upload
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/photoupload}
    username: ${DATABASE_USERNAME:dbadmin}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      data-source-properties:
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        cachePrepStmts: true
        useServerPrepStmts: true
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  servlet:
    multipart:
      enabled: false  # We handle uploads directly to S3

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket:
      name: ${S3_BUCKET_NAME:rapid-photo-upload-dev}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    thumbnails:
      prefix: ${S3_THUMBNAIL_PREFIX:thumbnails/}
    presigned-url:
      expiration-hours: 2
  eventbridge:
    bus-name: ${EVENTBRIDGE_BUS_NAME:default}

security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production}
    expiration-ms: 86400000  # 24 hours

resilience4j:
  circuitbreaker:
    instances:
      s3:
        registerHealthIndicator: true
        slidingWindowSize: 100
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  
  retry:
    instances:
      s3:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.rapidphotoupload: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"