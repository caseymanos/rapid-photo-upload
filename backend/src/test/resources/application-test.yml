  spring:
    datasource:
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

    flyway:
      enabled: false

  aws:
    region: us-east-1
    s3:
      bucket:
        name: test-bucket
      presigned-url:
        expiration-hours: 2

  security:
    jwt:
      secret: test-secret-key-for-testing-only
      expiration-ms: 86400000

  logging:
    level:
      com.rapidphotoupload: DEBUG
      org.springframework.web: DEBUG