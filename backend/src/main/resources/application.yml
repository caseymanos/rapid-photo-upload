spring:
  application:
    name: rapid-photo-upload
  
  datasource:
    url: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.nhadlfbxbivlhtkbolve
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      data-source-properties:
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        cachePrepStmts: true
        useServerPrepStmts: true
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  
  flyway:
    enabled: false  
  
  servlet:
    multipart:
      enabled: false  # We handle uploads directly to S3

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket:
      name: ${S3_BUCKET_NAME:rapid-photo-upload-dev}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    thumbnails:
      prefix: ${S3_THUMBNAIL_PREFIX:thumbnails/}
    presigned-url:
      expiration-hours: 2
  eventbridge:
    bus-name: ${EVENTBRIDGE_BUS_NAME:default}

cdn:
  images:
    enabled: ${CDN_IMAGES_ENABLED:false}
    base-url: ${CDN_BASE_URL:}
    path-prefix: /images
    default-format: ${CDN_DEFAULT_FORMAT:webp}
    feature-flag-key: ${CDN_FEATURE_FLAG:image-cdn}
    signing:
      enabled: ${CDN_SIGNING_ENABLED:false}
      key-pair-id: ${CDN_KEY_PAIR_ID:}
      private-key-pem: ${CDN_PRIVATE_KEY_PEM:}
      url-ttl: ${CDN_SIGNED_URL_TTL:PT30M}

feature:
  flags:
    image-cdn: ${FEATURE_FLAG_IMAGE_CDN:false}

security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production}
    expiration-ms: 86400000  # 24 hours
  supabase:
    jwt-secret: ${SUPABASE_JWT_SECRET:your-supabase-jwt-secret-change-in-production}

resilience4j:
  circuitbreaker:
    instances:
      s3:
        registerHealthIndicator: true
        slidingWindowSize: 100
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  
  retry:
    instances:
      s3:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.rapidphotoupload: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

thumbnails:
  backfill:
    batch-size: ${THUMBNAIL_BACKFILL_BATCH_SIZE:50}